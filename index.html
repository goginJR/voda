<!DOCTYPE html><html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Вода — выбор приложения</title>
<meta name="theme-color" content="#0b1220">
<link rel="icon" href="icons/icon-192.png">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0b1220;color:#e8eef9;
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;justify-content:center;gap:18px;padding:28px 20px}
h1{font-size:20px;margin:0 0 4px;font-weight:600}
p.sub{margin:0 0 14px;color:#8fa3bf;font-size:14px}
a.card{display:block;text-decoration:none;color:#e8eef9;background:#152238;
  border:1px solid #24344f;border-radius:16px;padding:18px 20px}
a.card:active{background:#1b2c49}
a.card b{display:block;font-size:19px;margin-bottom:2px}
a.card span{color:#8fa3bf;font-size:13px}
.note{color:#6f819c;font-size:12px;margin-top:6px}
</style></head><body>
<div>
  <h1>Вода</h1>
  <p class="sub">Два отдельных приложения. Поставь на телефон то, которым пользуешься.</p>
</div>
<a class="card" href="./m/"><b>Менеджер</b><span>заявки, клиенты, сбор рейса</span></a>
<a class="card" href="./d/"><b>Рейс — водитель</b><span>развоз, доставки, тара, отчёт</span></a>
<p class="note">Открой нужное, затем в Chrome ⋮ → «Установить приложение». Ставятся как два разных значка.</p>
<script>
// Старые ссылки вида /voda/#r=... уводим в водительское приложение.
if (location.hash.indexOf('#r=') === 0) location.replace('./d/' + location.hash);
// Снимаем сервис-воркер, который раньше жил на корне и кэшировал старое приложение.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => {
    if (r.scope.replace(location.origin,'').replace(/\/$/,'') === location.pathname.replace(/\/$/,'')) r.unregister();
  })).catch(()=>{});
}
if (window.caches) caches.keys().then(ks => ks.filter(k => k.indexOf('reis-v') === 0).forEach(k => caches.delete(k))).catch(()=>{});
</script>
</body></html>
