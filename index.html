<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Рейс</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:#0b1220;color:#e8eef9;
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:0 0 104px;
}
.wrap{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:19px;margin:4px 0 12px;font-weight:700}
h2{font-size:14px;margin:20px 0 8px;letter-spacing:.8px;text-transform:uppercase;color:#8da2c0}
.muted{color:#8da2c0}.small{font-size:13px}.tiny{font-size:12px}
.g{color:#7ee787}.r{color:#ff9d9d}.b{color:#79c0ff}.y{color:#ffd479}

.sum{background:#111c31;border-radius:16px;padding:14px;margin-bottom:12px}
.sum .big{font-size:34px;font-weight:800;letter-spacing:-.5px}
.row{display:flex;gap:10px}.row>div{flex:1}
.pill{background:#18243d;border-radius:12px;padding:9px 11px}
.pill b{display:block;font-size:19px;margin-top:2px}
.cash b{color:#7ee787}.cardp b{color:#79c0ff}

button{font:inherit;border:0;border-radius:12px;padding:13px;font-weight:700;cursor:pointer;color:#e8eef9}
.b-main{background:#2563eb;color:#fff;width:100%;font-size:17px;padding:17px}
.b-ok{background:#16a34a;color:#fff;width:100%;margin-top:10px}
.b-undo{background:#243352;color:#cfe0f7;width:100%;margin-top:10px}
.b-ghost{background:#18243d;color:#cfe0f7}
.b-warn{background:#3a2d16;color:#ffd479;width:100%;margin-top:8px}

/* ---------- «Сейчас» ---------- */
.now{background:#13244a;border:1px solid #2f4d85;border-radius:18px;padding:16px;margin-bottom:14px}
.now .lbl{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#79c0ff;font-weight:700}
.now .ad{font-size:26px;font-weight:800;line-height:1.15;margin:6px 0 2px}
.now .vl{font-size:13px;color:#9fc3ff}
.now .wq{font-size:19px;font-weight:700;margin-top:10px}
.now .acts{display:flex;gap:10px;margin-top:14px}
.now .acts>*{flex:1;text-align:center;text-decoration:none;border-radius:14px;padding:16px 8px;
  font-weight:800;font-size:16px;display:block}
.now .nav{background:#1f4c8a;color:#cfe4ff}
.now .ok{background:#16a34a;color:#fff}
.now .more{display:flex;gap:8px;margin-top:8px}
.now .more>*{flex:1;background:#1a2b4d;color:#9fc3ff;font-size:13px;padding:11px;border-radius:12px;
  text-align:center;font-weight:700}

/* ---------- точка в списке ---------- */
.vill{margin:16px 0 8px;font-size:13px;letter-spacing:.9px;text-transform:uppercase;color:#8da2c0;font-weight:700}
.pt{background:#111c31;border-radius:14px;margin-bottom:8px;border:1px solid #1b2944;overflow:hidden}
.pt.done{opacity:.45}
.pt.done .addr{text-decoration:line-through}
.pt.skip{opacity:.6;border-color:#4a3a1c}
.hd{padding:11px 10px 11px 13px;display:flex;align-items:center;gap:8px}
.hd .f{flex:1;min-width:0;cursor:pointer}
.hd .addr{font-weight:700;font-size:16px}
.mini{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:20px;flex:0 0 auto;text-decoration:none;padding:0}
.mini.nav{background:#1e3a5f;color:#9fc3ff}
.mini.ok{background:#16a34a;color:#fff}
.mini.undo{background:#243352;color:#cfe0f7;font-size:15px}
.bd{padding:0 13px 13px;display:none}
.pt.open .bd{display:block}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #1b2944}
.kv:last-of-type{border:0}
.kv span:last-child{text-align:right}

.apt{background:#16233f;border:1px solid #2b3c5e;border-radius:12px;padding:10px 12px;margin-top:10px}
.apt .ar{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.apt .ar b{font-size:16px}
.apt .big2{font-size:22px;font-weight:800;color:#ffd479}

.plus{display:flex;align-items:center;gap:8px;margin-top:10px;background:#18243d;padding:10px;border-radius:12px}
.plus span{flex:1;font-size:13px}
.plus button{background:#243352;padding:10px 14px;min-width:46px}
.plus button.add{background:#16a34a;color:#fff}
.tara{display:flex;align-items:center;gap:10px;margin-top:10px;background:#18243d;padding:10px;border-radius:12px}
.tara span{flex:1;font-size:13px}
.tara input{width:72px;background:#0b1220;border:1px solid #2b3c5e;color:#e8eef9;border-radius:10px;
  padding:10px;font-size:19px;text-align:center;font-weight:700}
.paysw{display:flex;gap:8px;margin-top:10px}
.paysw button{flex:1;background:#18243d;color:#8da2c0;padding:11px}
.paysw button.on{background:#2563eb;color:#fff}

.bar{position:fixed;left:0;right:0;bottom:0;background:#0b1220ee;backdrop-filter:blur(8px);
  padding:12px;border-top:1px solid #1b2944}
.bar .wrap{padding:0}

.load{background:#16233f;border:1px solid #2b3c5e;border-radius:16px;padding:14px;margin-bottom:12px}
.load h3{margin:0 0 10px;font-size:13px;letter-spacing:.9px;text-transform:uppercase;color:#9fc3ff}
.load .lr{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid #22304d}
.load .lr:last-child{border:0}
.load .lr span{font-size:17px;font-weight:700}
.load .lr b{font-size:26px;font-weight:800}
.load .lr i{font-style:normal;font-size:13px;color:#8da2c0;font-weight:400}

.fin .line{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #1b2944;font-size:17px}
.fin .line b{font-weight:800;white-space:nowrap}
.hero{background:#111c31;border-radius:16px;padding:18px;margin:14px 0;text-align:center}
.hero .big{font-size:36px;font-weight:800;margin-top:4px}
textarea{width:100%;height:160px;background:#0b1220;color:#cfe0f7;border:1px solid #2b3c5e;
  border-radius:12px;padding:10px;font:13px/1.4 ui-monospace,monospace}
.cst{background:#111c31;border-radius:14px;padding:12px;margin:14px 0}
.cst h3{margin:0 0 10px;font-size:15px}
.crow{display:flex;gap:8px;margin-bottom:8px}
.crow input{background:#0b1220;border:1px solid #2b3c5e;color:#e8eef9;border-radius:10px;padding:11px;font:inherit}
.crow .w{flex:1;min-width:0}
.crow .a{width:96px;text-align:right;font-weight:700}
.crow .x{width:42px;background:#243352;color:#ff9d9d;padding:0}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{background:#18243d;color:#cfe0f7;padding:9px 12px;font-size:13px}
details{margin-top:12px}
summary{cursor:pointer;color:#79c0ff;font-weight:700;padding:10px 0;font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="bar"><div class="wrap" id="bar"></div></div>

<script>
/* ---------- настройки ---------- */
const PAY_PER_BOTTLE   = 80;   // фикса водителю, ₽ за бутыль
const FLOOR_RATE       = 20;   // с клиента: ₽ за этаж за бутыль
const DRIVER_FLOOR_RATE= 15;   // водителю:  ₽ за этаж за бутыль
const SPARE            = 3;    // запас бутылей при погрузке
const MANAGER_TEL      = '+79870833737';

/* Порядок объезда районов. Угадан по географии — Дима правит одной строкой. */
const VILL_ORDER = ['ОпаЕльня','Большая Ельня','Крутая','Ждановский','ТИЗ Надежда',
                    'Культура / Опытный','ЖК Времена года','Карповка','Город','Кстово','Область','Свои'];
const villRank = v => { const i = VILL_ORDER.indexOf(v); return i < 0 ? 99 : i; };

/* Порядок улиц внутри района (Дима, 01.10). Чего нет в списке — в конец. */
const STREETS = ['Ближняя','Радужная','Весенняя','Дальняя','Садовая','Светлая'];
const streetRank = a => { const i = STREETS.findIndex(x => a.startsWith(x)); return i < 0 ? 99 : i; };

/* Заглушка по району, если у заявки нет своей точки на карте. */
const VILL_MAP = {
  'ОпаЕльня':           '',   // Опалиха и Малая Ельня вперемешку — только из заявки
  'Крутая':             'Нижегородская область, деревня Крутая',
  'Ждановский':         'Нижегородская область, рабочий посёлок Ждановский',
  'Кстово':             'Нижегородская область, город Кстово',
  'Большая Ельня':      'Нижегородская область, село Большая Ельня',
  'Культура / Опытный': 'Нижегородская область',
  'Карповка':           'Нижний Новгород',
  'Город':              'Нижний Новгород',
  'ЖК Времена года':    '', 'ТИЗ Надежда': '', 'Область': '', 'Свои': ''
};

/* ---------- рейс ----------
   Приходит ссылкой от менеджера: #r=<base64 json>. Разобранный рейс ложится
   в localStorage под свою дату, поэтому обновление кода не стирает отметки.
   DEMO — вчерашний настоящий рейс, чтобы было на чём потыкать. */
const DEMO = {d:'2026-10-01', pts:[
  {id:1, vill:'ОпаЕльня', addr:'Ближняя 27', name:'', pay:'card', items:[{w:'Идель',q:5,p:200}],
   map:'Нижегородская область, деревня Опалиха, Ближняя 27', note:'с 30.09 · замена плохих, тару оставить негде'},
  {id:2, vill:'ОпаЕльня', addr:'Радужная 15', name:'', pay:'card', items:[{w:'Идель',q:3,p:200}],
   map:'Нижегородская область, деревня Опалиха, Радужная 15', note:''},
  {id:3, vill:'ОпаЕльня', addr:'Радужная 21', name:'Надежда', pay:'card', items:[{w:'Идель',q:3,p:200}],
   map:'Нижегородская область, деревня Опалиха, Радужная 21', note:'заявка 12:37'},
  {id:4, vill:'ОпаЕльня', addr:'Садовая 1', name:'Ибрагимова Т. А.', pay:'card', items:[{w:'Идель',q:4,p:200}],
   map:'Нижегородская область, деревня Малая Ельня, Садовая 1', note:'тара есть · в справочнике такого дома нет'},
  {id:5, vill:'ОпаЕльня', addr:'Светлая 280', name:'Анастасия', pay:'card', items:[{w:'Идель',q:4,p:200}],
   map:'Нижегородская область, деревня Малая Ельня, Светлая 280', note:'висит с 28.09'},
  {id:6, vill:'ОпаЕльня', addr:'Светлая 94', name:'Татьяна Николаевна', pay:'card', items:[{w:'Идель',q:2,p:200}],
   map:'Нижегородская область, деревня Малая Ельня, Светлая 94', note:'с 30.09 · просила очень до 20'},
  {id:9, vill:'Крутая', addr:'Ясная 19', name:'Одинцова Ольга', pay:'card',
   items:[{w:'Идель',q:1,p:200},{w:'Дивеево',q:1,p:250}],
   map:'Нижегородская область, деревня Крутая, Ясная 19', note:'тара есть'},
  {id:10, vill:'Крутая', addr:'Калиновая 27', name:'Смолькова Надежда Игоревна', pay:'card',
   items:[{w:'Идель',q:2,p:200}], map:'Нижегородская область, деревня Крутая, Калиновая 27', note:''},
  {id:11, vill:'Ждановский', addr:'Кленовая 5/2', name:'Коломенцев А. В.', pay:'card',
   items:[{w:'Идель',q:4,p:200}], map:'Нижегородская область, рабочий посёлок Ждановский, Кленовая 5/2',
   note:'тара есть'},
  {id:7, vill:'Культура / Опытный', addr:'Культура Молодёжная 1', name:'Кабанова Н. В.', pay:'card',
   items:[{w:'Идель',q:2,p:200}], apt:{ent:'',floor:4,flat:'30',code:'32705',acc:'лифта нет'},
   map:'Нижегородская область, посёлок Культура, Молодёжная 1', note:'тара есть'},
  {id:8, vill:'ЖК Времена года', addr:'Изумрудная 20к2 кв 5', name:'Горошинский А. С.', pay:'card',
   items:[{w:'Идель',q:2,p:200}], map:'', note:'с 30.09 · точка на карте не задана'},
  {id:12, vill:'Кстово', addr:'Ступишина 2А к 6', name:'ЧПУ «Комплект 152»', pay:'card',
   items:[{w:'Идель',q:10,p:200}], map:'Нижегородская область, город Кстово, Ступишина 2А к 6',
   note:'новый адрес с 01.10, висит с 29.09'}
]};

/* ---------- приём рейса из ссылки ---------- */
function fromHash(){
  const m = /[#&]r=([^&]+)/.exec(location.hash || '');
  if(!m) return null;
  try{
    const b = m[1].replace(/-/g,'+').replace(/_/g,'/');
    const json = decodeURIComponent(escape(atob(b)));
    const r = JSON.parse(json);
    const u = unpack(r);
    if(!u || !Array.isArray(u.pts) || !u.pts.length || !u.d) throw new Error('не рейс');
    return u;
  }catch(e){ alert('Ссылка на рейс битая: ' + e.message); return null; }
}
/* Менеджер шлёт упакованный формат 2: словари повторов и поля массивом, иначе
   ссылка не влезает в сообщение Telegram. Читаемый формат тоже принимаем. */
function unpack(r){
  if(!r) return null;
  if(r.v !== 2) return (Array.isArray(r.pts) ? r : null);
  return {d: r.d, pts: r.P.map(a => {
    const p = {id:a[0], vill:(r.V[a[1]]||''), addr:a[2], name:a[3]||'',
               pay:(a[4] ? 'cash' : 'card'),
               items:a[5].map(x => ({w:(r.W[x[0]]||'вода'), q:x[1], p:x[2]}))};
    if(a[6] >= 0 && r.M[a[6]])            p.map = r.M[a[6]] + ', ' + p.addr;
    else if(a[6] <= -2 && r.M[-a[6]-2])   p.map = r.M[-a[6]-2];   // строка целиком
    if(a[7]) p.note = a[7];
    const ap = a[8];
    if(ap) p.apt = {floor:ap.f||0, flat:ap.k||'', ent:ap.e||'', code:ap.c||'', acc:ap.a||''};
    return p;
  })};
}

const incoming = fromHash();
const ROUTE = incoming || DEMO;
const ROUTE_DATE = ROUTE.d;
const KEY = 'reis-' + ROUTE_DATE;
const SCHEMA = 3;
if(incoming){                                  // ссылку из адреса убираем, чтобы
  history.replaceState(null, '', location.pathname);   // обновление не грузило её заново
  try{ localStorage.setItem('reis-last', JSON.stringify(ROUTE)); }catch(e){}
}

/* ---------- состояние ---------- */
// st: '' ждёт | 'done' доставлено | 'skip' не открыли/перенос
const mk = p => ({...p, st:'', back:null, extra:0, ts:null, why:''});

let S = load();
function load(){
  let old = null;
  try{ const r = localStorage.getItem(KEY); if(r) old = JSON.parse(r); }catch(e){}
  const st = {v:SCHEMA, stage:'prep', open:null, costs:[], pts:ROUTE.pts.map(mk), started:null, ended:null};
  if(!old || !Array.isArray(old.pts)) return st;
  st.stage   = old.stage   || 'prep';
  st.costs   = Array.isArray(old.costs) ? old.costs : [];
  st.started = old.started || null;
  st.ended   = old.ended   || null;
  // переносим отметки водителя на актуальные заявки, а не затираем их
  st.pts = st.pts.map(p => {
    const o = old.pts.find(x => x.id === p.id);
    if(!o) return p;
    return {...p,
      st:    o.st !== undefined ? o.st : (o.done ? 'done' : ''),   // со старой схемы
      back:  (o.back === undefined ? null : o.back),
      pay:   o.pay || p.pay,
      extra: Number(o.extra) || 0,
      ts:    o.ts || null,
      why:   o.why || ''
    };
  });
  return st;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- расчёты ---------- */
const basePrice = p => p.items[0].p;
const ordered   = p => p.items.reduce((s,i)=>s+i.q,0);
const qty       = p => ordered(p) + (p.extra||0);
const floorOf   = p => (p.apt && Number(p.apt.floor)) || 0;
const floorFee  = p => floorOf(p) * FLOOR_RATE * qty(p);
const waterSum  = p => p.items.reduce((s,i)=>s+i.q*i.p,0) + (p.extra||0)*basePrice(p);
const sum       = p => waterSum(p) + floorFee(p);
const floorPay  = p => floorOf(p) * DRIVER_FLOOR_RATE * qty(p);

const money = n => n.toLocaleString('ru-RU')+' ₽';
const water = p => p.items.map(i=>i.w+' '+i.q).join(' + ') + ((p.extra||0) ? ` +${p.extra}` : '');
const tm    = ts => new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
const dur   = ms => { const m = Math.round(ms/60000);
  return m >= 60 ? Math.floor(m/60)+' ч '+String(m%60).padStart(2,'0')+' мин' : m+' мин'; };
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

function byWater(){
  const m = {};
  S.pts.forEach(p => p.items.forEach(i => { m[i.w] = (m[i.w]||0) + i.q; }));
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
function mapAddr(p){
  if(p.map) return p.map;
  const v = VILL_MAP[p.vill];
  return v ? v + ', ' + p.addr : '';
}
const navLink = p => { const a = mapAddr(p);
  return a ? 'https://yandex.ru/maps/?rtext=~'+encodeURIComponent(a)+'&rtt=auto' : ''; };

/* Единый порядок объезда: район, улица, номер дома. Номер сравниваем числом —
   как текст «Светлая 280» встаёт перед «Светлая 94». */
const streetName = a => String(a||'').replace(/\d.*$/,'').trim().toLowerCase().replace(/ё/g,'е');
const houseNo    = a => { const m = String(a||'').match(/(\d+)/); return m ? +m[1] : 0; };
const inOrder = () => S.pts.slice().sort((a,b) =>
  (villRank(a.vill) - villRank(b.vill)) ||
  (streetRank(a.addr) - streetRank(b.addr)) ||
  streetName(a.addr).localeCompare(streetName(b.addr),'ru') ||
  (houseNo(a.addr) - houseNo(b.addr)));
const nextPt = () => inOrder().find(p => !p.st) || null;

function totals(only){
  const list = only ? S.pts.filter(only) : S.pts;
  return {
    n:    list.length,
    q:    list.reduce((s,p)=>s+qty(p),0),
    all:  list.reduce((s,p)=>s+sum(p),0),
    cash: list.filter(p=>p.pay==='cash').reduce((s,p)=>s+sum(p),0),
    card: list.filter(p=>p.pay==='card').reduce((s,p)=>s+sum(p),0),
    back: list.reduce((s,p)=>s+(Number(p.back)||0),0),
    fl:   list.reduce((s,p)=>s+floorPay(p),0)
  };
}
const doneOrder = () => S.pts.filter(p=>p.st==='done').sort((a,b)=>(a.ts||0)-(b.ts||0));

/* ---------- отрисовка ---------- */
function render(){
  const a = document.getElementById('app'), b = document.getElementById('bar');
  if(S.stage==='prep')     renderPrep(a,b);
  else if(S.stage==='run') renderRun(a,b);
  else                     renderFin(a,b);
  save();
}

/* ====================== ДО РЕЙСА ====================== */
function renderPrep(a,b){
  const t = totals();
  a.innerHTML = `<h1>Заявки на ${ROUTE_DATE.split('-').reverse().join('.')}</h1>
    <div class="sum">
      <div class="muted small">К развозу</div>
      <div class="big">${t.q} бут.</div>
      <div class="muted small" style="margin-top:2px">${t.n} адресов · ${money(t.all)}</div>
    </div>
    <div class="load">
      <h3>Грузить на заводе</h3>
      ${byWater().map(([w,q])=>`<div class="lr"><span>${esc(w)}</span><b>${q+SPARE}</b></div>
        <div class="lr" style="padding-top:0"><i>по заявкам ${q} + запас ${SPARE} (можно ${SPARE+1})</i></div>`).join('')}
    </div>
    <div class="muted small" style="margin-bottom:10px">Пока не нажал «Я в рейсе» — список может меняться.</div>
    ${inOrder().map(cardPrep).join('')}`;
  b.innerHTML = `<button class="b-main" onclick="start()">Я в рейсе · ${t.q} бут.</button>`;
}
const cardPrep = p => `<div class="pt"><div class="hd"><div class="f">
    <div class="addr">${esc(p.addr)}</div>
    <div class="muted tiny">${esc(p.vill)} · ${esc(water(p))}${floorOf(p)?` · ${floorOf(p)} этаж`:''}</div>
  </div><div style="font-weight:800;white-space:nowrap">${money(sum(p))}</div></div></div>`;

/* ====================== В РЕЙСЕ ====================== */
function renderRun(a,b){
  const t = totals(), list = inOrder();
  const left = list.filter(p=>!p.st).length, done = list.filter(p=>p.st==='done').length;
  const now = nextPt();
  const rest = list.filter(p => !now || p.id !== now.id);
  const byV = {};
  rest.forEach(p=>{ (byV[p.vill] = byV[p.vill]||[]).push(p); });
  const vills = Object.keys(byV).sort((x,y)=>villRank(x)-villRank(y));

  a.innerHTML = `
    ${now ? cardNow(now) : `<div class="now"><div class="lbl">Все точки отмечены</div>
      <div class="ad" style="font-size:20px">Осталось закрыть рейс</div></div>`}
    <div class="muted small">Сделано <b>${done}</b> из ${t.n}${left?` · осталось ${left}`:''}</div>
    ${vills.map(v=>`<div class="vill">${esc(v)}</div>`+byV[v].map(cardRun).join('')).join('')}
    <details>
      <summary>Деньги и погрузка</summary>
      <div class="sum" style="margin-top:8px">
        <div class="muted small">Всего по рейсу</div>
        <div class="big">${money(t.all)}</div>
        <div class="row" style="margin-top:12px">
          <div class="pill cash"><span class="muted tiny">наличными</span><b>${money(t.cash)}</b></div>
          <div class="pill cardp"><span class="muted tiny">переводом</span><b>${money(t.card)}</b></div>
        </div>
        <div class="small b" style="margin-top:10px">Погрузка: ${byWater().map(([w,q])=>esc(w)+' '+(q+SPARE)).join(' · ')} (с запасом ${SPARE})</div>
        ${S.started?`<div class="small muted" style="margin-top:4px">В рейсе с ${tm(S.started)} · ${dur(Date.now()-S.started)}</div>`:''}
      </div>
    </details>`;
  b.innerHTML = left
    ? `<button class="b-ghost" style="width:100%" onclick="finish()">Развоз закончен · осталось ${left}</button>`
    : `<button class="b-main" onclick="finish()">Развоз закончен</button>`;
}

/* Крупная карточка текущей точки: два действия и ничего лишнего. */
function cardNow(p){
  const nl = navLink(p), f = floorOf(p);
  return `<div class="now">
    <div class="lbl">Сейчас едем</div>
    <div class="ad">${esc(p.addr)}</div>
    <div class="vl">${esc(p.vill)}${p.name?' · '+esc(p.name):''}</div>
    <div class="wq">${esc(water(p))} · ${money(sum(p))}
      <span class="small ${p.pay==='cash'?'g':'b'}">${p.pay==='cash'?'наличные':'перевод'}</span></div>
    ${p.apt?`<div class="apt">
      ${p.apt.flat?`<div class="ar"><span class="muted">Квартира</span><b>${esc(p.apt.flat)}</b></div>`:''}
      ${p.apt.ent ?`<div class="ar"><span class="muted">Подъезд</span><b>${esc(p.apt.ent)}</b></div>`:''}
      ${f         ?`<div class="ar"><span class="muted">Этаж</span><b class="big2">${f}</b></div>`:''}
      ${p.apt.code?`<div class="ar"><span class="muted">Домофон</span><b class="big2">${esc(p.apt.code)}</b></div>`:''}
      ${p.apt.acc ?`<div class="ar"><span class="muted">Доступ</span><b>${esc(p.apt.acc)}</b></div>`:''}
    </div>`:''}
    ${p.note?`<div class="small y" style="margin-top:10px">${esc(p.note)}</div>`:''}
    <div class="acts">
      ${nl?`<a class="nav" href="${esc(nl)}" target="_blank" rel="noopener">Маршрут</a>`
          :`<button class="nav" onclick="noMap()">Маршрут</button>`}
      <button class="ok" onclick="deliver(${p.id})">Доставлено</button>
    </div>
    <div class="more">
      <button onclick="toggle(${p.id});scrollTo(0,0)">Подробно</button>
      <button onclick="skip(${p.id})">Не открыли</button>
      <a href="tel:${esc(MANAGER_TEL)}" style="text-decoration:none;line-height:1.5">Менеджер</a>
    </div>
  </div>`;
}

/* Свёрнутая точка: адрес, вода и сразу два действия — навигатор и галочка. */
const cardRun = p => {
  const nl = navLink(p), f = floorOf(p), cls = p.st==='done'?'done':p.st==='skip'?'skip':'';
  return `<div class="pt ${cls} ${S.open===p.id?'open':''}" id="p${p.id}">
  <div class="hd">
    <div class="f" onclick="toggle(${p.id})">
      <div class="addr">${esc(p.addr)}</div>
      <div class="muted tiny">${esc(water(p))} · ${money(sum(p))}${f?` · ${f} эт.`:''}${
        p.st==='done'&&p.ts?` · ${tm(p.ts)}`:''}${p.st==='skip'?' · не открыли':''}</div>
    </div>
    ${p.st ? `<button class="mini undo" onclick="undo(${p.id})">↩</button>`
      : `${nl?`<a class="mini nav" href="${esc(nl)}" target="_blank" rel="noopener">➤</a>`
            :`<button class="mini nav" onclick="noMap()">➤</button>`}
         <button class="mini ok" onclick="deliver(${p.id})">✓</button>`}
  </div>
  <div class="bd">
    ${p.name?`<div class="kv"><span class="muted">Клиент</span><span>${esc(p.name)}</span></div>`:''}
    <div class="kv"><span class="muted">Везём</span><span>${esc(water(p))}</span></div>
    ${p.apt?`<div class="apt">
      ${p.apt.flat?`<div class="ar"><span class="muted">Квартира</span><b>${esc(p.apt.flat)}</b></div>`:''}
      ${p.apt.ent ?`<div class="ar"><span class="muted">Подъезд</span><b>${esc(p.apt.ent)}</b></div>`:''}
      ${f         ?`<div class="ar"><span class="muted">Этаж</span><b class="big2">${f}</b></div>`:''}
      ${p.apt.code?`<div class="ar"><span class="muted">Домофон</span><b class="big2">${esc(p.apt.code)}</b></div>`:''}
      ${p.apt.acc ?`<div class="ar"><span class="muted">Доступ</span><b>${esc(p.apt.acc)}</b></div>`:''}
    </div>`:''}
    ${f?`<div class="kv"><span class="muted">Вода / занос</span><span>${money(waterSum(p))} + ${money(floorFee(p))}
      <div class="muted tiny">${f} эт. × ${FLOOR_RATE} ₽ × ${qty(p)} бут.</div></span></div>`:''}
    ${p.note?`<div class="kv"><span class="muted">Комментарий</span><span>${esc(p.note)}</span></div>`:''}
    <div class="plus">
      <span>Отдал больше заявки<br><span class="muted tiny">заказано ${ordered(p)}, отдано ${qty(p)}</span></span>
      ${(p.extra||0)?`<button onclick="addBottle(${p.id},-1)">−1</button>`:''}
      <button class="add" onclick="addBottle(${p.id},1)">+1</button>
    </div>
    ${p.st==='done' && p.back !== qty(p)
      ? `<div class="tara"><span>Забрал пустой тары</span>
           <input type="number" inputmode="numeric" min="0" value="${p.back===null?'':p.back}"
                  onchange="setBack(${p.id},this.value)"></div>`
      : `<div class="tara"><span>Тара: забрал ${p.st==='done'?qty(p):'столько же, сколько привёз'}</span>
           <button class="b-ghost" style="padding:10px 12px" onclick="taraOther(${p.id})">другое число</button></div>`}
    <div class="paysw">
      <button class="${p.pay==='card'?'on':''}" onclick="setPay(${p.id},'card')">Перевод</button>
      <button class="${p.pay==='cash'?'on':''}" onclick="setPay(${p.id},'cash')">Наличные</button>
    </div>
    ${p.st
      ? `<button class="b-undo" onclick="undo(${p.id})">Вернуть в работу</button>`
      : `<button class="b-ok" onclick="deliver(${p.id})">Доставлено</button>
         <button class="b-warn" onclick="skip(${p.id})">Не открыли / перенос</button>`}
  </div></div>`;
};

/* ====================== ПОСЛЕ РЕЙСА ====================== */
function renderFin(a,b){
  const d = totals(p=>p.st==='done'), t = totals();
  const sk = S.pts.filter(p=>p.st==='skip');
  const earned = d.q * PAY_PER_BOTTLE + d.fl;
  const costs  = S.costs.reduce((x,c)=>x+(Number(c.amt)||0),0);
  const diff   = d.cash - earned - costs;
  const total  = (S.started && S.ended) ? S.ended - S.started : 0;
  a.innerHTML = `<h1>Развоз закончен</h1><div class="fin">
    <div class="hero">
      ${diff >= 0
        ? `<div class="muted">Вернуть шефу</div><div class="big g">${money(diff)}</div>`
        : `<div class="muted">Шеф должен водителю</div><div class="big r">${money(-diff)}</div>`}
    </div>
    <div class="line"><span>Доставлено</span><b>${d.n} из ${t.n} · ${d.q} бут.</b></div>
    <div class="line"><span>Наличных на руках</span><b class="g">${money(d.cash)}</b></div>
    <div class="line"><span>Заработал</span><b class="y">${money(earned)}</b></div>
    ${sk.length?`<div class="line"><span>Не открыли</span><b class="r">${sk.length}</b></div>`:''}

    <div class="cst">
      <h3>Расходы водителя</h3>
      ${S.costs.map((c,i)=>`<div class="crow">
        <input class="w" value="${esc(c.what)}" placeholder="за что" onchange="setCost(${i},'what',this.value)">
        <input class="a" type="number" inputmode="numeric" value="${c.amt===''?'':c.amt}" placeholder="0" onchange="setCost(${i},'amt',this.value)">
        <button class="x" onclick="delCost(${i})">✕</button>
      </div>`).join('')}
      <div class="quick">
        <button onclick="addCost('Каршеринг')">Каршеринг</button>
        <button onclick="addCost('ГСМ')">ГСМ</button>
        <button onclick="addCost('Мойка')">Мойка</button>
        <button onclick="addCost('')">Другое</button>
      </div>
      ${costs?`<div class="line" style="border:0;padding-top:12px"><span>Итого расходов</span><b class="r">${money(costs)}</b></div>`:''}
    </div>

    <details>
      <summary>Весь расклад и текст отчёта</summary>
      ${total?`<div class="line"><span>В рейсе</span><b class="y">${dur(total)}</b></div>
      <div class="line"><span>В среднем на точку</span><b>${d.n?dur(total/d.n):'—'}</b></div>`:''}
      <div class="line"><span>Переводом (шефу напрямую)</span><b class="b">${money(d.card)}</b></div>
      <div class="line"><span>Фикса · ${PAY_PER_BOTTLE} ₽ × ${d.q}</span><b>${money(d.q*PAY_PER_BOTTLE)}</b></div>
      ${d.fl?`<div class="line"><span>Заносы</span><b>${money(d.fl)}</b></div>`:''}
      <div class="line"><span>Выдал бутылей</span><b>${d.q}</b></div>
      <div class="line"><span>Забрал пустой тары</span><b>${d.back}</b></div>
      <div class="line"><span>Разница по таре</span><b class="${d.q-d.back?'r':''}">${d.q-d.back}</b></div>
      <textarea id="rep" readonly style="margin-top:14px">${esc(report(d,earned,costs,diff,total))}</textarea>
      <button class="b-ghost" style="width:100%;margin-top:8px" onclick="copyRep()">Скопировать текст</button>
    </details>
  </div>`;
  b.innerHTML = `<button class="b-main" onclick="sendRep()">Отправить отчёт в телеграм</button>
    <button class="b-ghost" style="width:100%;margin-top:8px" onclick="back()">Вернуться в рейс</button>`;
}

function report(d,earned,costs,diff,total){
  const done = doneOrder();
  const cl = S.costs.filter(c=>Number(c.amt)>0)
    .map(c=>`· ${c.what||'расход'} — ${money(Number(c.amt))}`).join('\n');
  let prev = S.started;
  const lines = done.map((p,i)=>{
    const t = p.ts ? tm(p.ts) : '--:--';
    const leg = (p.ts && prev) ? ' (' + dur(p.ts - prev) + ')' : '';
    if(p.ts) prev = p.ts;
    return `${i+1}. ${t}${leg} ${p.addr} — ${water(p)} — ${money(sum(p))} ${p.pay==='cash'?'наличные':'перевод'}`
      + (p.back!==null?`, тары ${p.back}`:'')
      + (floorOf(p)?`, занос ${floorOf(p)} эт.`:'')
      + ((p.extra||0)?`, отдано +${p.extra} сверх заявки`:'');
  }).join('\n');
  const sk = S.pts.filter(p=>p.st==='skip')
    .map(p=>`· ${p.addr} — ${water(p)}${p.why?' ('+p.why+')':''}`).join('\n');
  return `Рейс ${ROUTE_DATE.split('-').reverse().join('.')}
Доставлено: ${d.n} адр., ${d.q} бут.${total?`\nВ рейсе: ${dur(total)}${S.started?` (с ${tm(S.started)} до ${tm(S.ended)})`:''}`:''}

Порядок объезда:
${lines}${sk?`\n\nНе открыли / перенос:\n${sk}`:''}

Наличными: ${money(d.cash)}
Переводом: ${money(d.card)}
Заработал: ${money(d.q*PAY_PER_BOTTLE)}${d.fl?`\nЗаносы: ${money(d.fl)}\nИтого заработал: ${money(earned)}`:''}${cl?`\n\nРасходы водителя:\n${cl}\nИтого расходов: ${money(costs)}`:''}
${diff>=0?`Вернуть шефу: ${money(diff)}`:`Шеф должен водителю: ${money(-diff)}`}
Тара: выдал ${d.q}, забрал ${d.back}, разница ${d.q-d.back}`;
}

/* ---------- действия ---------- */
function toggle(id){ S.open = (S.open===id ? null : id); render(); }
function setPay(id,v){ pt(id).pay = v; render(); }
function setBack(id,v){ pt(id).back = (v===''?null:Math.max(0,parseInt(v)||0)); save(); }
function taraOther(id){
  const p = pt(id), def = p.back===null ? qty(p) : p.back;
  const v = prompt('Сколько пустой тары забрал?', def);
  if(v===null) return;
  p.back = Math.max(0, parseInt(v)||0); render();
}
function addBottle(id,dl){ const p = pt(id); p.extra = Math.max(0,(p.extra||0)+dl); render(); }
function deliver(id){
  const p = pt(id);
  p.st = 'done';
  p.ts = p.ts || Date.now();
  if(p.back === null) p.back = qty(p);   // по умолчанию забрал столько же
  S.open = null;
  render(); scrollTo({top:0, behavior:'smooth'});
}
function skip(id){
  const p = pt(id);
  const why = prompt('Что с точкой? (не открыли, перенос, отказ)', 'не открыли');
  if(why===null) return;
  p.st = 'skip'; p.why = why; p.ts = Date.now(); p.back = 0;
  S.open = null;
  render(); scrollTo({top:0, behavior:'smooth'});
}
function undo(id){ const p = pt(id); p.st = ''; p.ts = null; p.why = ''; p.back = null; render(); }
function pt(id){ return S.pts.find(x=>x.id===id); }
function noMap(){ alert('Для этого адреса не задана точка на карте. Спроси полный адрес у менеджера.'); }
function addCost(w){ S.costs.push({what:w, amt:''}); render(); }
function setCost(i,k,v){ S.costs[i][k] = (k==='amt' ? (v===''?'':Math.max(0,parseInt(v)||0)) : v); render(); }
function delCost(i){ S.costs.splice(i,1); render(); }
function start(){ S.stage='run'; S.started = S.started || Date.now(); render(); }
function finish(){
  const left = S.pts.filter(p=>!p.st).length;
  if(left && !confirm(`Ещё ${left} точек не отмечены. Всё равно закончить рейс?`)) return;
  S.stage='fin'; S.ended = Date.now(); render(); scrollTo(0,0);
}
function back(){ S.stage='run'; render(); }
function repText(){
  const d = totals(p=>p.st==='done');
  const earned = d.q*PAY_PER_BOTTLE + d.fl;
  const costs  = S.costs.reduce((x,c)=>x+(Number(c.amt)||0),0);
  const total  = (S.started && S.ended) ? S.ended - S.started : 0;
  return report(d, earned, costs, d.cash - earned - costs, total);
}
function sendRep(){
  const t = repText();
  if(navigator.share) return navigator.share({text:t}).catch(()=>{});
  location.href = 'https://t.me/share/url?url=' + encodeURIComponent('https://goginjr.github.io/voda/')
                + '&text=' + encodeURIComponent(t);
}
function copyRep(){
  const t = document.getElementById('rep');
  if(!t) return;
  t.select(); t.setSelectionRange(0,99999);
  try{ document.execCommand('copy'); alert('Отчёт скопирован'); }catch(e){ alert('Выдели текст и скопируй вручную'); }
}
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
</body>
</html>
